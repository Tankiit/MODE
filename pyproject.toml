[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-selective-training"
version = "0.2.0"
description = "Token-level data selection with scorer mixtures for causal language models."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "datasets>=2.12.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "torch>=2.0.0",
    "transformers>=4.56.0",
]

[project.optional-dependencies]
analysis = ["scipy>=1.10", "matplotlib>=3.7"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["sieve*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
force_sort_within_sections = true

