[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ramengpt"
version = "0.1.0"
description = "Train small GPT models on a single GPU."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "datasets",
    "tiktoken",
    "numpy",
    "torch",
    "transformers",
    "huggingface-hub",
    "kernels",
    "einops",
    "setuptools",
    "wandb",
]

[project.optional-dependencies]
# CUDA fused kernels for GPT-2 LM head / CE (train_sieve applies when installed + gpt2 model)
liger = ["liger-kernel"]

[tool.setuptools]
packages = []

[tool.uv]
dev-dependencies = [
    "black",
    "isort",
]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
force_sort_within_sections = true
