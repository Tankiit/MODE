[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sieve-selective-training"
version = "0.1.0"
description = "Selective token-level training for causal language models."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "datasets>=2.12.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "tqdm>=4.65.0",
]

[project.optional-dependencies]
liger = ["liger-kernel"]

[tool.setuptools.packages.find]
include = ["sieve*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100
force_sort_within_sections = true

